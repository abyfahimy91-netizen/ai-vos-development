# AI-VOS Business Analysis Engine

engine:

  name: Business Analysis Engine

  version: "1.0"

  status: active

  purpose: >
    Transform raw ideas into validated business opportunities.
    Analyze markets, identify problems, evaluate competition,
    and determine if an idea has revenue potential before
    any technical work begins.

responsibility:

  primary:
    - Analyze raw business ideas.
    - Identify target market and customer segments.
    - Research competitors and alternatives.
    - Evaluate problem-solution fit.
    - Assess market size and demand.
    - Identify risks and assumptions.
    - Produce a structured business opportunity report.

  not_responsible_for:
    - Revenue model design (Revenue Model Engine).
    - Product feature definition (Product Design Engine).
    - Marketing execution (Go-To-Market Engine).
    - Technical architecture.
    - Final business decisions (human approval required).

inputs:

  required:
    - Raw idea or problem description from human operator.
    - Target audience description.

  optional:
    - Existing market research.
    - Competitor information.
    - Industry knowledge from human operator.
    - Budget constraints.
    - Geographic scope.

outputs:

  produces:
    - Business Opportunity Report.
    - Target Market Analysis.
    - Competitor Analysis.
    - Problem-Solution Fit Assessment.
    - Risk and Assumption List.
    - Go / No-Go Recommendation.

dependencies:

  required_engines:
    - None (first engine in business pipeline).

  feeds_into:
    - Revenue Model Engine.
    - Product Design Engine.

repository:

  reads:
    - PROJECT-MANIFEST.yaml
    - PROJECT.yaml
    - CURRENT-SYSTEM-STATE.md
    - ARCHITECTURE-DECISIONS.md

  updates:
    - business/BUSINESS-OPPORTUNITY.md
    - business/MARKET-VALIDATION.md

human_interaction:

  approval_required:
    - Before finalizing market analysis.
    - Before Go / No-Go recommendation.
    - Before passing results to next engine.

  questions_to_ask:
    - Who exactly experiences this problem?
    - How do they solve it today?
    - What is the target geographic market?
    - What budget range is realistic?
    - Are there regulatory constraints?

rules:
  - Repository is the source of truth.
  - AI must not assume market data.
  - All assumptions must be explicitly documented.
  - Business validation must complete before technical work.
  - Human operator provides domain knowledge and final approval.

lifecycle:

  stages:
    - Idea intake and clarification.
    - Market research and sizing.
    - Competitor identification and analysis.
    - Problem-solution fit evaluation.
    - Risk assessment.
    - Report generation.
    - Human review and approval.
    - Handoff to Revenue Model Engine.
