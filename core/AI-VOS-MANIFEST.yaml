name: AI-VOS
full_name: AI Virtual Operating System
version: "1.1.0"
status: active

purpose: >
  AI operating system that transforms raw ideas into
  revenue-generating businesses through structured
  AI-human collaboration. Non-programmer operators
  work with AI to build complete business products.

principles:
  source: core/PRINCIPLES.md
  repository_is_source_of_truth: true
  chat_history_is_permanent_memory: false
  human_executor_required: true
  confirmation_required_before_operations: true
  business_first_technology_second: true

boot:
  entry_point: boot/SYSTEM.yaml
  sequence:
    - boot/AI-ENTRY.md
    - core/PRINCIPLES.md
    - core/CURRENT-SYSTEM-STATE.md
    - core/ARCHITECTURE-DECISIONS.md
    - core/ENGINE-SPECIFICATION.md
    - core/NEXT_TASK.md

engines:
  total: 12
  business:
    - business-analysis
    - revenue-model
    - product-design
    - go-to-market
  technical:
    - requirement-analysis
    - continuity
    - architecture-decision
    - technology-selection
    - security-analysis
    - documentation
    - development-planning
    - testing-quality
  initialization:
    - project-initialization

layers:
  boot:
    path: boot/
    status: active
  core:
    path: core/
    status: active
  workspace:
    path: workspace/
    status: active
  templates:
    path: templates/
    status: active

roles:
  ai:
    responsibility: >
      Analysis, planning, documentation, architecture,
      business strategy, code generation guidance.
  human:
    responsibility: >
      Execute commands, validate results,
      approve changes, provide domain knowledge.

continuity:
  objective: >
    Any compatible AI system can continue work
    from repository information only.
  memory: repository
